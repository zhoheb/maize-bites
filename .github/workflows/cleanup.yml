name: Cleanup

# Daily housekeeping: deletes expired sessions and sign-in links, and events that ended more
# than EVENT_RETENTION_DAYS ago; rolls page views into daily totals and deletes raw page views
# past 90 days and analytics salts from before yesterday. `pnpm cleanup:once` is the same
# thing locally.
#
# Run by hand only. The daily run is a step of ingest.yml, so it shares the database's 5:05 AM
# wake-up instead of causing its own.

on:
  workflow_dispatch:

concurrency:
  group: cleanup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
      EVENT_RETENTION_DAYS: ${{ vars.EVENT_RETENTION_DAYS || '30' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          package: '@maize-bites/worker'
      - run: pnpm cleanup:once
