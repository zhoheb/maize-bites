<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Maize Bites · Free food at the University of Michigan</title>
    <meta
      name="description"
      content="Find free food on the University of Michigan campus right now: live events, a campus map, and dietary filters."
    />
    <meta name="theme-color" content="#faf8f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1f3a" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Maize Bites · Free food at the University of Michigan" />
    <meta
      property="og:description"
      content="What free food is on campus right now, where it is, and how soon."
    />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Start the landing view's two requests while the script downloads. The URLs must match
         src/api/events.ts exactly (the Now tab with no filters) or the browser fetches twice. -->
    <link rel="preload" href="/api/events/now?limit=100" as="fetch" crossorigin />
    <link rel="preload" href="/api/health" as="fetch" crossorigin />
    <!-- Sets the theme before first paint so there is no flash. Kept in step with lib/theme.ts. -->
    <script>
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('mb-theme');
        } catch (e) {}
        var dark =
          saved === 'dark' ||
          (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <!-- A static copy of the site header, painted before the script runs and replaced by React.
         Keep it the same height as AppShell's header (h-14) so nothing moves on the swap. -->
    <div id="root">
      <div class="min-h-dvh bg-page text-ink">
        <div class="flex h-14 items-center gap-2 border-b border-line px-4 lg:px-6">
          <img src="/icons/favicon.svg" alt="" width="28" height="28" class="size-7" />
          <span class="font-display text-lg font-bold tracking-tight">Maize Bites</span>
        </div>
      </div>
    </div>
    <noscript>Maize Bites needs JavaScript to show live events.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
