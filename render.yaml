# Render blueprint: the API, as a free Docker web service. Postgres lives on Neon; paste its
# connection string into DATABASE_URL. The web app is on Vercel (apps/web/vercel.json).
# Values marked `sync: false` are secrets or per-environment settings you enter in the dashboard.
#
# There is no worker service. Free plans have no background workers or cron jobs, so ingestion,
# the digest and cleanup run as scheduled GitHub Actions (.github/workflows/).
#
# What the free plan means for the API:
# - It sleeps after 15 minutes without a request and takes about a minute to wake. The web app
#   waits that out with retries and says what is happening.
# - Pre-deploy commands are for paid services only, so migrations are applied by
#   .github/workflows/migrate.yml, which then triggers the deploy. Auto-deploy stays off here so
#   that a push can't deploy the API ahead of its migration.
services:
  - type: web
    name: maize-bites-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    autoDeploy: false
    healthCheckPath: /api/health
    envVars:
      # Render sets PORT itself; the API listens on it (API_PORT is only the local default).
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Vercel's rewrite and Render's load balancer both sit in front of the API.
      - key: TRUST_PROXY
        value: 2
      - key: DATABASE_URL
        sync: false
      # The web app's origin, e.g. https://maizebites.zachhoheb.dev (no trailing slash).
      - key: WEB_ORIGIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
